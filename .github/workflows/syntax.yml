name: Syntax

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m py_compile dbus-sdm630-modbus.py tools/scan_modbus.py tools/read_l1_voltage.py
