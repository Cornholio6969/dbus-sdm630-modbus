; SDM630 Modbus V3 RTU D-Bus driver for Victron Venus OS

[DEFAULT]
; ERROR, WARNING, INFO, DEBUG
logging = INFO

; Name shown in Venus OS device list
device_name = SDM630 Modbus Grid

; grid = Grid, genset = Generator, acload = AC Load, heatpump = Heat Pump.
device_type = grid

; VRM/device instance. 40 is commonly used for grid meters.
device_instance = 40

; Stop the driver if no valid Modbus read was received within this many seconds.
; Set to 0 to disable timeout.
timeout = 60

; Power sanity limit per phase in W
power_threshold_per_phase = 23000

[MODBUS]
; USB RS485 adapter path
port = /dev/ttyUSB0

; SDM630 Modbus slave address
slave_id = 1

; SDM630 default is usually 9600 8N1
baudrate = 9600
parity = N
stopbits = 1
bytesize = 8

; Per request timeout in seconds
modbus_timeout = 2

; Normal polling interval.
poll_interval_ms = 2000

; Delay between attempts after a failed poll or disconnected serial adapter.
reconnect_interval_ms = 10000

; Set to true if Victron sign convention is backwards for your installation
invert_power = false

; Read per-phase energy registers every N normal polls. These are slower and
; less important than live power/voltage/current.
phase_energy_poll_every = 5

; Enable pymodbus debug logs when diagnosing serial/RTU trouble.
verbose_modbus = false
